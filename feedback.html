<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>フィードバック | 公園の正しい使い方</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-title="title_feedback">
  <header>
    <div class="top">
      <strong data-i18n="site">公園の正しい使い方</strong>
      <label class="language">Language:
        <select id="language">
          <option value="ja">日本語</option>
          <option value="en">English</option>
          <option value="zh-CN">简体中文</option>
          <option value="zh-TW">繁體中文</option>
          <option value="ko">한국어</option>
          <option value="de">Deutsch</option>
          <option value="fr">Français</option>
          <option value="it">Italiano</option>
          <option value="es">Español</option>
          <option value="pt">Português</option>
        </select>
      </label>
    </div>
    <a href="index.html" data-i18n="nav_home">ホーム</a>
    <a href="rules.html" data-i18n="nav_rules">ルール</a>
    <a href="game.html" data-i18n="nav_game">ゲーム</a>
    <a href="feedback.html" data-i18n="nav_feedback">フィードバック</a>
  </header>

  <main>
    <h1 data-i18n="fb_title">フィードバックを送る</h1>
    <p data-i18n="fb_intro">サイトやゲームへのご意見・不具合の報告を、GitHub（このサイトの置き場所）に投稿して送れます。</p>

    <form id="fbForm">
      <label>
        <span data-i18n="fb_type">種類</span>
        <select id="type">
          <option value="bug" data-i18n="fb_t_bug">不具合</option>
          <option value="idea" data-i18n="fb_t_idea">意見・要望</option>
          <option value="other" data-i18n="fb_t_other">その他</option>
        </select>
      </label>

      <label>
        <span data-i18n="fb_message">内容</span>
        <textarea id="message" rows="6" maxlength="300" required></textarea>
      </label>

      <button type="submit" id="send" data-i18n="fb_send">送信する</button>
    </form>

    <p data-i18n="fb_notice">「送信する」を押すとGitHubの画面が開きます。投稿は誰でも見られます。GitHubアカウントが必要です。個人情報は書かないでください。</p>
    <p id="status" role="status"></p>
  </main>

  <footer>
    <p>© <span data-i18n="site">公園の正しい使い方</span></p>
  </footer>

  <script src="lang.js"></script>
  <script src="feedback.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ゲーム | 公園の正しい使い方</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-title="title_game">
  <header>
    <div class="top">
      <strong data-i18n="site">公園の正しい使い方</strong>
      <label class="language">Language:
        <select id="language">
          <option value="ja">日本語</option>
          <option value="en">English</option>
          <option value="zh-CN">简体中文</option>
          <option value="zh-TW">繁體中文</option>
          <option value="ko">한국어</option>
          <option value="de">Deutsch</option>
          <option value="fr">Français</option>
          <option value="it">Italiano</option>
          <option value="es">Español</option>
          <option value="pt">Português</option>
        </select>
      </label>
    </div>
    <a href="index.html" data-i18n="nav_home">ホーム</a>
    <a href="rules.html" data-i18n="nav_rules">ルール</a>
    <a href="game.html" data-i18n="nav_game">ゲーム</a>
    <a href="feedback.html" data-i18n="nav_feedback">フィードバック</a>
  </header>

  <main>
    <h1 data-i18n="runner_title">パークランナー</h1>
    <p data-i18n="runner_intro">タップかスペースキーでジャンプ。ごみをひろって、障害物とハトをよけよう！長く押すと高くジャンプ。</p>

    <div id="stage">
      <canvas id="game"></canvas>
      <div id="overlay">
        <div id="ovStart">
          <h2 data-i18n="runner_title">パークランナー</h2>
          <p data-i18n="runner_tap">タップしてスタート</p>
        </div>
        <div id="ovOver" hidden>
          <h2 data-i18n="runner_over">ゲームオーバー</h2>
          <p id="final"></p>
          <p data-i18n="game_retry">もう一度あそぶ</p>
        </div>
      </div>
    </div>

    <p><a href="game.html" data-i18n="back_games">ゲーム一覧にもどる</a></p>
  </main>

  <footer>
    <p>© <span data-i18n="site">公園の正しい使い方</span></p>
  </footer>

  <script src="lang.js"></script>
  <script src="runner.js"></script>
</body>
</html>
